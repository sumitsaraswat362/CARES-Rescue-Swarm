name: CARES validation
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir -r requirements-dev.txt
      - run: python tools/check_claims.py
      - run: python -m pytest tests -q
      - run: python src/main.py --headless --scenario scenarios/relay_required.yaml --seed 100 --out logs/ci
      - run: python tools/audit_evidence.py logs/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-evidence
          path: logs/ci
  cold-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash verify_cold.sh
