scenario:
  name: "OSM synthetic building loader test"
swarm:
  num_uavs: 2
# NOTE: This scenario uses a single representative synthetic building (dummy_osm.json)
# to validate the OSM loader pipeline end-to-end.
# The fetch_osm.py script targets the real Overpass API for IIT Bombay campus
# (bounding box: 19.125,72.905,19.140,72.925), but live fetch requires network access.
# To use real data: run `python3 fetch_osm.py` (with network), rename
# the output to iitb_buildings.json, and set osm_file below to "iitb_buildings.json".
simulation:
  duration_s: 1800.0

world:
  width: 1000
  height: 1000
  osm_file: "dummy_osm.json"     # synthetic validation data — see note above
  osm_origin_lat: 19.126
  osm_origin_lon: 72.906
  obstacles: []

gcs:
  position: {x: 200.0, y: 200.0}
launch_pad:
  position: {x: 200.0, y: 200.0}

points_of_interest:
  - id: 1
    x: 500.0
    y: 500.0
    priority: 10.0

resilience:
  range_m: 300.0

events: []
